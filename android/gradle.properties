# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Recommended heap size for Android + Compose + KSP builds
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Enables local build cache
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style for this project
kotlin.code.style=official

# Non-transitive R class for faster build performance
android.nonTransitiveRClass=true
